<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">你的天才同学 · Your Brilliant Classmate</title>
  <desc id="desc">更适合国内大学生体质的学习skill。先学习归纳你提供的资料，建立课程资源库；再通过持续对话，结合提问、解题思路和作答表现不断更新学习画像；最后依据画像产出个性化期末复习资料。下方为三阶段工作方式示意。</desc>
  <rect width="1200" height="480" rx="8" fill="#F4F7F5"/>
  <g id="course-heading" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <path d="M64 55 H98" stroke="#236953" stroke-width="4"/>
    <text x="112" y="64" font-size="24" font-weight="600" fill="#236953">一起上课，一起想明白。</text>
    <text x="1136" y="64" text-anchor="end" font-size="22" fill="#5F7169">CODEX SKILL / 大学学习</text>
    <text x="60" y="171" font-size="86" font-weight="700" fill="#182B24">你的天才同学</text>
    <path d="M409 187 Q538 177 661 184" fill="none" stroke="#E4745D" stroke-width="7" stroke-linecap="round"/>
    <text x="66" y="228" font-size="28" fill="#236953">Your Brilliant Classmate</text>
    <text x="66" y="281" font-size="30" fill="#182B24">更适合国内大学生体质的学习skill</text>
  </g>
  <g id="source-page-motif" stroke="#236953" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M970 119 H1106 V251 H970 Z" stroke-width="2"/>
    <path d="M950 101 H1086 V233" stroke-width="2"/>
    <path d="M994 151 H1079 M994 171 H1059 M994 212 H1031" stroke="#92A69B" stroke-width="3"/>
    <path d="M989 188 H1065" stroke="#E4745D" stroke-width="9"/>
    <path d="M1081 206 L1090 215 L1108 193" stroke-width="4"/>
  </g>
  <path d="M64 320 H1136" stroke="#CBD8D0" stroke-width="1.5"/>
  <g id="learning-sequence" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <g id="course-materials">
      <text x="66" y="367" font-size="24" font-weight="600" fill="#E4745D">01</text>
      <text x="110" y="368" font-size="34" font-weight="600" fill="#182B24">建立课程资源库</text>
      <text x="110" y="412" font-size="24" fill="#5F7169">学习资料 / 归纳整理</text>
    </g>
    <path d="M418 350 V420" stroke="#CBD8D0" stroke-width="1.5"/>
    <g id="reasoning">
      <text x="450" y="367" font-size="24" font-weight="600" fill="#E4745D">02</text>
      <text x="494" y="368" font-size="34" font-weight="600" fill="#182B24">更新学习画像</text>
      <text x="494" y="412" font-size="24" fill="#5F7169">持续对话 / 越来越懂你</text>
    </g>
    <path d="M802 350 V420" stroke="#CBD8D0" stroke-width="1.5"/>
    <g id="learning-records">
      <text x="834" y="367" font-size="24" font-weight="600" fill="#E4745D">03</text>
      <text x="878" y="368" font-size="34" font-weight="600" fill="#182B24">产出复习资料</text>
